services:
  - type: web
    name: docwallet-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python fix_sqlalchemy.py && python cors_patch.py && python link_patch.py && python pay_patch.py && python paid_cert_patch.py && python sign_patch.py && python intelligence_patch.py && python docflow_patch.py && python icp_signature_patch.py && python review_user_patch.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: docwallet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://docwallet.netlify.app,https://localhost,http://localhost,capacitor://localhost,ionic://localhost,http://localhost:5173
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: DOCWALLET_PUBLIC_URL
        value: https://docwallet.netlify.app
      - key: DOCUMENT_INTELLIGENCE_ENABLED
        value: "true"
      - key: DOCUMENT_INTELLIGENCE_PROVIDER
        value: internal
      - key: DOCUMENT_INTELLIGENCE_STORE_RAW_TEXT
        value: "true"
      - key: DOCUMENT_INTELLIGENCE_ALLOW_EXTERNAL
        value: "false"
      - key: DOCFLOW_ENABLED
        value: "true"
      - key: DOCFLOW_DEFAULT_TENANT_NAME
        value: DocFlow Workspace
      - key: DOCFLOW_EXTERNAL_INTEGRATIONS_ENABLED
        value: "false"
      - key: ICP_SIGNATURE_ENABLED
        value: "false"
      - key: ICP_SIGNATURE_PROVIDER
        value: pending_provider
      - key: ICP_SIGNATURE_MODE
        value: external_provider
      - key: ICP_SIGNATURE_PROVIDER_BASE_URL
        value: ""
