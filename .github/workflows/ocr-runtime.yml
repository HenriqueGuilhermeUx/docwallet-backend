name: OCR Runtime Validation

on:
  push:
    branches:
      - feature/docwallet-5-paddleocr
    paths:
      - 'dw_ocr.py'
      - 'requirements-ocr.txt'
      - '.github/workflows/ocr-runtime.yml'

jobs:
  paddle-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OCR runtime
        run: pip install -r requirements-ocr.txt
      - name: Real PaddleOCR smoke
        env:
          DOCUMENT_OCR_ENABLED: "true"
          DOCUMENT_OCR_PROVIDER: paddle_local
          DOCUMENT_OCR_LANGUAGE: pt
          DOCUMENT_OCR_VERSION: PP-OCRv6
          DOCUMENT_OCR_DEVICE: cpu
          DOCUMENT_OCR_USE_DOC_ORIENTATION: "false"
          DOCUMENT_OCR_USE_DOC_UNWARPING: "false"
          DOCUMENT_OCR_USE_TEXTLINE_ORIENTATION: "false"
        run: |
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from PIL import Image, ImageDraw, ImageFont
          from dw_ocr import extract_document_text

          out = Path('/tmp/docwallet-ocr-real.png')
          img = Image.new('RGB', (1400, 420), 'white')
          draw = ImageDraw.Draw(img)
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 72)
          draw.text((60, 70), 'CONTRATO DOCWALLET', fill='black', font=font)
          draw.text((60, 190), 'VALOR R$ 1.500,00', fill='black', font=font)
          img.save(out)

          result = extract_document_text(SimpleNamespace(file_path=str(out), file_type='image/png'))
          print(result.metadata())
          print(result.text)
          assert result.used_ocr, result
          assert result.ocr_chars >= 10, result
          assert 'DOCWALLET' in result.text.upper(), result.text
          print('Real PaddleOCR smoke: OK')
          PY
