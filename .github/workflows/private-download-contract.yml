name: DocWallet private download contract (offline)

on:
  pull_request:
    paths:
      - 'app.py'
      - 'tests/test_private_download_contract.py'
      - '.github/workflows/private-download-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bearer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Unset all potentially connected backend services.
      DATABASE_URL: ''
      NEXA_SSO_ENABLED: 'false'
      NEXA_ECOSYSTEM_ATTENTION_ENABLED: 'false'
      DOCWALLET_RPC_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            Flask==3.0.3 Flask-Cors==4.0.1 Flask-SQLAlchemy==3.1.1 \
            SQLAlchemy==2.0.31 python-dotenv==1.0.1 PyJWT==2.8.0 \
            bcrypt==4.1.3 Werkzeug==3.0.3 pypdf==4.3.1 reportlab==4.2.5
      - name: Apply the same startup patch as Render, locally on CI copy
        run: |
          python fix_sqlalchemy.py
          python -m py_compile app.py
      - name: Run private-document authorization contract offline
        run: python -m unittest discover -s tests -p test_private_download_contract.py -v
